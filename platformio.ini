; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common_esp32]
platform = espressif32
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.mcu = esp32
board_build.f_cpu = 240000000L
lib_deps = 
	arduino-libraries/NTPClient@^3.2.1
	TelnetStream

[env:esp32_usb]
extends = common_esp32
board = esp32doit-devkit-v1
upload_protocol = esptool

[env:esp32_ota]
extends = common_esp32
board = lolin_d32
upload_protocol = espota
upload_port = 192.168.31.115
upload_flags = 
	--port=3232
	--auth=admin
monitor_port = socket://192.168.31.115:23

[common_esp8266]
platform = espressif8266
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.mcu = esp8266
board_build.f_cpu = 80000000L
lib_deps = 
	arduino-libraries/NTPClient@^3.2.1
	TelnetStream
	olikraus/U8g2@^2.36.18
	feilipu/FreeRTOS@^11.1.0-3

[env:nodemcuv2_usb]
extends = common_esp8266
board = nodemcuv2
upload_protocol = esptool

[env:nodemcuv2_ota]
extends = common_esp8266
board = nodemcuv2
upload_protocol = espota
upload_port = 192.168.31.45
upload_flags = 
	--port=3232
	--auth=admin
monitor_port = socket://192.168.31.45:23

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_speed = 115200
monitor_speed = 115200
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L
lib_deps = 
	arduino-libraries/NTPClient@^3.2.1
